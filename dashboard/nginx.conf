server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;   # ne révèle pas la version de nginx

    # Attention : un add_header dans un "location" annule ceux du niveau supérieur,
    # d'où les en-têtes de sécurité répétés dans chaque bloc.

    # Fichiers avec hash dans le nom (main-ABC123.js) : cache long
    location ~* \.(js|css|ico|png|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Routes Angular (/login...) : toujours renvoyer index.html
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
