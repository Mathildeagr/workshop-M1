# Broker MQTT Sentinel-X (configuration minimale, TLS à ajouter : listener 8883 + certificats)

listener 1883

# Aucune connexion anonyme : chaque client (ESP8266, backend) a un compte
allow_anonymous false
password_file /mosquitto/config/passwd

# Sans liste de contrôle, un compte authentifié publie où il veut : l'identité
# ne vaudrait que pour entrer, pas pour agir.
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

# Logs vers stdout : lus avec "docker compose logs mosquitto", la rotation est gérée par Docker
log_dest stdout
log_type error
log_type warning
log_type notice
