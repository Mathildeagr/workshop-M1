name: sentinel-x

services:

  traefik:
    image: traefik:v3.3
    container_name: sentinel-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=sentinel-edge
      - --entrypoints.websecure.address=:443
      - --entrypoints.mqtts.address=:8883
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    ports:
      - "443:443"
      - "8883:8883"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/etc/certs:ro
    networks:
      - edge

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sentinel-mosquitto
    restart: unless-stopped
    ports:
      # MQTT en clair pour les nœuds IoT. Traefik n'expose que le 8883 en TLS, et
      # l'ESP8266 ne parle pas encore MQTTS : sans ce port, il ne peut pas joindre
      # le broker. Le sous-réseau de table est étanche et le broker refuse les
      # connexions anonymes, mais ça reste du trafic en clair : à retirer dès que
      # le nœud passe en MQTTS.
      # MQTT_BIND_IP dans le .env permet de restreindre l'écoute à la seule
      # adresse du réseau de table plutôt qu'à toutes les interfaces.
      - "${MQTT_BIND_IP:-0.0.0.0}:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    networks:
      - edge
      - internal
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.mqtt.rule=HostSNI(`*`)
      - traefik.tcp.routers.mqtt.entrypoints=mqtts
      - traefik.tcp.routers.mqtt.tls=true
      - traefik.tcp.services.mqtt.loadbalancer.server.port=1883

  ntp:
    image: cturra/ntp:latest
    container_name: sentinel-ntp
    restart: unless-stopped
    ports:
      - "123:123/udp"
    environment:
      - NTP_SERVERS=time.cloudflare.com   # amont, si la machine a un accès sortant TODO: CHanger si pas internet voir possibilité avec routeur.
      - LOG_LEVEL=0
    networks:
      - edge

  database:
    image: postgres:16-alpine
    container_name: sentinel-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans le .env racine}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_events}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d$${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ./backend
    container_name: sentinel-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-sentinel_events}
      CORS_ORIGINS: https://sentinel.localhost,https://localhost
      TRUST_PROXY: "1"
      # Service vision : sur l'hôte par défaut, http://ai-vision:5000 avec le profil "vision"
      VISION_SERVICE_URL: ${VISION_SERVICE_URL:-http://host.docker.internal:5000}
      VISION_SERVICE_TOKEN: ${VISION_SERVICE_TOKEN:-}
    extra_hosts:
      - host.docker.internal:host-gateway   # déjà fourni par Docker Desktop, nécessaire sous Linux
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - edge
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=PathPrefix(`/api`) || PathPrefix(`/socket.io`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls=true
      - traefik.http.services.backend.loadbalancer.server.port=3000

  frontend:
    build:
      context: ./dashboard
    container_name: sentinel-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.services.frontend.loadbalancer.server.port=80

  # flux caméra : détection personnes/visages + alertes vers le backend
  # Docker Desktop (macOS/Windows) ne transmet pas la webcam USB aux conteneurs, /dev/video0 ne fonctionne
  # que sur un hôte Linux. Ailleurs, lancer ai-vision/server.py directement sur la machine hôte.
  # Profil "vision" : démarré seulement avec "docker compose --profile vision up"
  ai-vision:
    build:
      context: ./ai-vision
    container_name: sentinel-ai-vision
    restart: unless-stopped
    profiles: ["vision"]
    environment:
      SENTINEL_SERVICE_TOKEN: ${VISION_SERVICE_TOKEN:-}   # même valeur que VISION_SERVICE_TOKEN du backend
      SENTINEL_API_URL: http://backend:3000/api/v1/alerts
      SENTINEL_API_TOKEN: ${VISION_API_KEY:-}            # clé "vision" de DEVICE_API_KEYS (backend/.env)
      SENTINEL_API_ENABLED: "1"
    volumes:
      - vision-data:/app/data   # visages enregistrés + snapshots des alertes
    devices: ["/dev/video0:/dev/video0"]  # hôte Linux uniquement (ex : Raspberry Pi)
    depends_on:
      - backend
    networks:
      - internal

  # données capteurs -> événements d'environnement
  # Écoute les mesures sur le bus, les archive, et émet env_drift / env_anomaly /
  # env_critical / env_cleared. Reçoit ses consignes sur sentinel/predictive/command.
  predict-anomalie:
    build:
      context: ./predict-anomalie
    container_name: sentinel-predict-anomalie
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-sentinel_events}
      PREDICT_MQTT_HOST: mosquitto
      PREDICT_MQTT_USER: ${PREDICT_MQTT_USER:-predictive}
      PREDICT_MQTT_PASSWORD: ${PREDICT_MQTT_PASSWORD:?PREDICT_MQTT_PASSWORD manquant dans le .env racine}
      # Sortie de secours tant que le backend n'a pas d'abonné MQTT : il reçoit
      # alors les alertes par sa propre route. Laisser vide pour la couper.
      SENTINEL_API_URL: ${PREDICT_API_URL:-http://backend:3000/api/v1/alerts}
      SENTINEL_API_TOKEN: ${PREDICT_API_KEY:-}
    volumes:
      - predict-models:/var/lib/predict-anomalie   # modèle entraîné, rechargé au démarrage
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - internal   # pas d'exposition : le dashboard passe par le backend

networks:
  edge:
    name: sentinel-edge
  internal:
    name: sentinel-internal
    internal: true

volumes:
  db-data:
  mosquitto-data:
  mosquitto-logs:
  vision-data:
  predict-models:
  # traefik-certs:
