name: sentinel-x

services:

  traefik:
    image: traefik:v3.3
    container_name: sentinel-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=sentinel-edge
      - --entrypoints.websecure.address=:443
      - --entrypoints.mqtts.address=:8883
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    ports:
      - "443:443"
      - "8883:8883"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/etc/certs:ro
    networks:
      - edge

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sentinel-mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    networks:
      - edge
      - internal
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.mqtt.rule=HostSNI(`*`)
      - traefik.tcp.routers.mqtt.entrypoints=mqtts
      - traefik.tcp.routers.mqtt.tls=true
      - traefik.tcp.services.mqtt.loadbalancer.server.port=1883

  database:
    image: postgres:16-alpine
    container_name: sentinel-database
    restart: unless-stopped
    environment:
      # Utilisation des noms de variables de ton collègue pour correspondre à son .env
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans le .env racine}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_events}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d$${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ./backend
    container_name: sentinel-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-sentinel_events}
      CORS_ORIGINS: https://sentinel.localhost,https://localhost
      TRUST_PROXY: "1"
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - edge
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=PathPrefix(`/api`) || PathPrefix(`/socket.io`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls=true
      - traefik.http.services.backend.loadbalancer.server.port=3000

  frontend:
    build:
      context: ./dashboard
    container_name: sentinel-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.services.frontend.loadbalancer.server.port=80

  ia-vision:
    build:
      context: ./ia-vision
    container_name: sentinel-ia-vision
    restart: unless-stopped
    depends_on:
      - mosquitto
    networks:
      - internal
    devices: 
      - "/dev/video0:/dev/video0"

  predict-anomalie:
    build:
      context: ./predict-anomalie
    container_name: sentinel-predict-anomalie
    restart: unless-stopped
    depends_on:
      - mosquitto
      - database
    networks:
      - internal

networks:
  edge:
    name: sentinel-edge
  internal:
    name: sentinel-internal
    internal: true

volumes:
  db-data:
  mosquitto-data:
  mosquitto-logs: