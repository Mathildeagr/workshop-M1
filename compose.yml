name: sentinel-x

services:

  # Entré réseau / routage / TLS
  traefik:
    image: traefik:v3.3
    container_name: sentinel-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=sentinel-edge
      - --entrypoints.web.address=:80
      # - --entrypoints.websecure.address=:443
      - --entrypoints.mqtt.address=:1883
      # - --api.dashboard=true
    ports:
      - "${HTTP_PORT:-80}:80"   # HTTP_PORT dans le .env si le port 80 est déjà pris sur la machine
      # - "443:443"
      - "1883:1883"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # - ./traefik/dynamic:/etc/traefik/dynamic:ro
      # - traefik-certs:/letsencrypt
    networks:
      - edge

  # Bus de messages capteurs
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sentinel-mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    networks:
      - edge  # nécessaire pour exposition MQTT à l'ESP8266
      - internal
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.mqtt.rule=HostSNI(`*`)
      - traefik.tcp.routers.mqtt.entrypoints=mqtt
      - traefik.tcp.services.mqtt.loadbalancer.server.port=1883

  # Identifiants lus dans le .env à la racine (voir .env.example)
  database:
    image: postgres:16-alpine
    container_name: sentinel-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans le .env racine}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelx}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ./backend
    container_name: sentinel-backend
    restart: unless-stopped
    # Secrets de l'API (JWT_SECRET, DEVICE_API_KEYS, ADMIN_*) : backend/.env
    env_file: ./backend/.env
    # Valeurs propres à Docker : elles remplacent celles du backend/.env (prévues pour le dev local)
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-sentinelx}
      CORS_ORIGINS: http://sentinel.localhost,http://localhost
      TRUST_PROXY: "1"   # derrière Traefik : vraie IP client pour le rate limiting
    depends_on:
      database:
        condition: service_healthy   # attend que Postgres accepte les connexions
      mosquitto:
        condition: service_started
    networks:
      - edge
      - internal
    labels:
      - traefik.enable=true
      # Sans Host() : l'API répond aussi via l'IP du serveur (ESP8266, autres PC de la table)
      - traefik.http.routers.backend.rule=PathPrefix(`/api`) || PathPrefix(`/socket.io`)
      - traefik.http.routers.backend.entrypoints=web
      - traefik.http.services.backend.loadbalancer.server.port=3000

  frontend:
    build:
      context: ./dashboard
    container_name: sentinel-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - edge
    labels:
      - traefik.enable=true
      # Tout ce qui n'est pas /api ou /socket.io (Traefik donne la priorité à la règle la plus longue)
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.services.frontend.loadbalancer.server.port=80

  # flux caméra : détection personnes/visages + alertes vers le backend
  # Docker Desktop (macOS/Windows) ne transmet pas la webcam USB aux conteneurs, /dev/video0 ne fonctionne
  # que sur un hôte Linux. Ailleurs, lancer ai-vision/server.py directement sur la machine hôte.
  # Profil "vision" : démarré seulement avec "docker compose --profile vision up"
  ai-vision:
    build:
      context: ./ai-vision
    container_name: sentinel-ai-vision
    restart: unless-stopped
    profiles: ["vision"]
    environment:
      SENTINEL_SERVICE_TOKEN: ${VISION_SERVICE_TOKEN:-}   # même valeur que VISION_SERVICE_TOKEN du backend
      SENTINEL_API_URL: http://backend:3000/api/v1/alerts
      SENTINEL_API_TOKEN: ${VISION_API_KEY:-}            # clé "vision" de DEVICE_API_KEYS (backend/.env)
      SENTINEL_API_ENABLED: "1"
    volumes:
      - vision-data:/app/data   # visages enregistrés + snapshots des alertes
    devices: ["/dev/video0:/dev/video0"]  # hôte Linux uniquement (ex : Raspberry Pi)
    depends_on:
      - backend
    networks:
      - internal

  # Service IA désactivé tant que son dossier (Dockerfile + code) n'existe pas : sinon "docker compose up" échoue.
  #
  # # données capteurs -> événements
  # predict-anomalie:
  #   build:
  #     context: ./predict-anomalie
  #   container_name: sentinel-predict-anomalie
  #   restart: unless-stopped
  #   depends_on:
  #     - mosquitto
  #     - database
  #   networks:
  #     - internal
  #   #TODO: on veut un volume pour stocker le modèle entrainé ?

networks:
  edge: # Attention exposé via traefik du coup
    name: sentinel-edge
  internal: # Normalement non accessible depuis l'extérieur
    name: sentinel-internal
    internal: true

volumes:
  db-data:
  mosquitto-data:
  mosquitto-logs:
  vision-data:
  # traefik-certs:
