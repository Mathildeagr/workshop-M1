[project]
name = "predict-anomalie"
version = "0.1.0"
description = "Detection d'anomalies environnementales sur le flux capteurs Sentinel-X"
requires-python = ">=3.12"

dependencies = [
    "polars>=2.0",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "psycopg[binary]>=3.2",
    "aiomqtt>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[project.scripts]
predict-anomalie = "predict_anomalie.__main__:main"
seed-history = "predict_anomalie.seed:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predict_anomalie"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
